# .github/workflows/helm-publish.yml
name: Helm Chart Package & Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'values.yml'
      - 'ingress.yml'
      - 'users.yml'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Generate version
      id: version
      run: |
        VERSION="1.1.5"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

    - name: Update Chart.yaml
      run: |
        sed -i "s/version: .*/version: ${{ steps.version.outputs.version }}/" charts/theai/Chart.yaml
        sed -i "s/appVersion: .*/appVersion: \"${{ steps.version.outputs.version }}\"/" charts/theai/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/theai/Chart.yaml
        sed -i "s|{{ github_username }}|${{ github.repository_owner }}|g" charts/theai/values.yaml
        cat charts/theai/Chart.yaml

    - name: Lint Helm chart
      run: helm lint charts/theai

    - name: Package Helm chart
      run: |
        mkdir -p charts
        helm package charts/theai -d charts/
        ls -lah charts/

    - name: Create Helm index
      run: |
        if [ -f charts/index.yaml ]; then
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/THEAI/ --merge charts/index.yaml
        else
          helm repo index charts/ --url https://${{ github.repository_owner }}.github.io/THEAI/
        fi
        cat charts/index.yaml

    - name: Create documentation
      run: |
        cat > charts/README.md << 'EOF'
        # THEAI Helm Charts
        
        Kubernetes deployment chart for THEAI Application (Backend + Frontend + PostgreSQL).
        
        ## Add Repository
        
        ```bash
        helm repo add theai https://${{ github.repository_owner }}.github.io/THEAI/
        helm repo update
        ```
        
        ## Install Chart
        
        ```bash
        helm upgrade --install theai theai/theai \
          --namespace theai \
          --create-namespace \
          -f ingress.yaml
        ```

        ## Values.yaml - change values.
        ```yaml

          secrets:
            create: true
            name: theai-secret
            data:
              SECRET_KEY: "changeMeSecretKey"
              POSTGRES_SERVER: "theai-postgres"
              POSTGRES_PORT: "5432"
              POSTGRES_DB: "server_monitoring"
              POSTGRES_USER: "admindb"
              POSTGRES_PASSWORD: "changeMe123!"
              SMTP_SERVER: "smtp.gmail.com"
              SMTP_PORT: "587"
              SMTP_USERNAME: "your-email@gmail.com"
              SMTP_PASSWORD: "your-app-password"
              SMTP_FROM_EMAIL: "monitoring@theai.local"
              SMTP_USE_TLS: "true"
              ENABLE_EMAIL_ALERTS: "true"
              DEFAULT_ADMIN_USERNAME: "admin"
              DEFAULT_ADMIN_PASSWORD: "AdminPass123"
              DEFAULT_ADMIN_EMAIL: "admin@theai.local"

        ```
        
        ## ingress.yaml
        ```yaml
            ingress:
              enabled: true
              className: "nginx"
              annotations:
                #nginx.ingress.kubernetes.io/rewrite-target: /
                nginx.ingress.kubernetes.io/proxy-body-size: "20m"
              
              hosts:
                - host: theai.local
                  paths:
                    - path: /
                      pathType: Prefix
                      service: frontend
                      port: 80
                    - path: /api
                      pathType: Prefix
                      service: backend
                      port: 8000
              
              tls:
                enabled: false
        ```

        ## Prerequisites
        
        - Kubernetes 1.20+
        - Helm 3.0+
        - Ingress Controller (nginx-ingress)
        
        ## Configuration Files (at repo root)
        
        - `values.yml` - Helm values (mandatory)
        - `ingress.yml` - Ingress configuration (mandatory)
        - `users.yml` - Application users (optional)
        
        ## Deploy with Generic Ansible Pipeline
        
        ```bash
        ansible-playbook deploy_helm_generic.yml 

        use : https://github.com/iwebbo/Ansible/tree/main/roles/deploy_herlmchart_stack_standalone

        ```
        
        ## Check
        
        ```bash
        # List charts
        helm search repo theai
        
        # Get values
        helm show values theai/theai
        
        # Dry run
        helm install theai theai/theai --dry-run --debug
        ```
        EOF
        cat charts/README.md

    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
        fetch-depth: 0

    - name: Copy charts to gh-pages
      run: |
        mkdir -p gh-pages
        cp -r charts/* gh-pages/
        ls -lah gh-pages/

    - name: Commit and push to gh-pages
      run: |
        cd gh-pages
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Publishing Helm chart ${{ steps.version.outputs.version }}" || true
        git push origin gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create deployment summary
      run: |
        echo "## 📦 Helm Chart Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Chart Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📍 Repository URL" >> $GITHUB_STEP_SUMMARY
        echo "https://${{ github.repository_owner }}.github.io/THEAI/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Add Repository" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm repo add theai https://${{ github.repository_owner }}.github.io/THEAI/" >> $GITHUB_STEP_SUMMARY
        echo "helm repo update" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Install" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "helm install theai theai/theai -n theai --create-namespace -f values.yaml" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY