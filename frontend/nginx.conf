server {
    listen 80;
    server_name localhost;

    # Inventaire d'agent (liste de paquets) : le défaut de 1 Mo est trop juste
    client_max_body_size 20m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Binaires de l'agent et scripts d'installation (volume agent_dist alimenté par theai-agent-build)
    location /downloads/agent/ {
        alias /usr/share/nginx/agent-dist/;
        default_type application/octet-stream;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    # Proxy pour l'API backend
    location /api {
        proxy_pass http://theai-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # Grafana (servi sous /grafana/ : GF_SERVER_SERVE_FROM_SUB_PATH=true)
    location /grafana/ {
        proxy_pass http://theai-grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gestion des erreurs
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
