# charts/theai/templates/configmap-nginx.yaml
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "theai.fullname" . }}-frontend-nginx
  labels:
    {{- include "theai.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';
        access_log /dev/stdout main;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        # Les inventaires de paquets des agents peuvent depasser quelques Mo
        client_max_body_size {{ (.Values.frontend.nginx | default dict).clientMaxBodySize | default "20m" }};

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;

        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      '';
        }

        upstream api {
            server {{ include "theai.fullname" . }}-backend:{{ .Values.backend.service.port }};
            keepalive 16;
        }

        {{- if .Values.grafana.enabled }}

        upstream grafana {
            server {{ include "theai.name" . }}-grafana:{{ .Values.grafana.service.port }};
        }
        {{- end }}

        server {
            listen {{ .Values.frontend.service.targetPort }};
            server_name _;
            root /usr/share/nginx/html;

            location / {
                try_files $uri $uri/ /index.html;
            }

            {{- if .Values.agent.enabled }}

            # Binaires + scripts d'installation de l'agent (copies par l'initContainer agent-dist).
            # Doit exister AVANT le fallback SPA, sinon /downloads/agent/install.sh renvoie index.html.
            location /downloads/agent/ {
                alias /usr/share/nginx/agent-dist/;
                default_type application/octet-stream;
                autoindex off;
                add_header Cache-Control "no-cache" always;
            }
            {{- end }}

            location /api {
                proxy_pass http://api;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

                proxy_connect_timeout 60s;
                proxy_send_timeout 120s;
                proxy_read_timeout 120s;
            }
            {{- if .Values.grafana.enabled }}

            location /grafana/ {
                proxy_pass http://grafana;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            }
            {{- end }}
        }
    }
{{- end }}
